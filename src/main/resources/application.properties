# ---------------------------------------------------------------------------
# JWT
#
# El valor de abajo es un SECRETO DE DESARROLLO, publico a proposito: esta en
# el repositorio para que cualquiera pueda clonar y arrancar la app sin
# configurar nada. Justamente por eso NO sirve para produccion: cualquiera que
# lea el repo puede firmar tokens validos, incluidos los de ADMINISTRADOR.
#
# Para usar un secreto de verdad hay dos formas, sin tocar este archivo:
#   1) perfil "local"  -> poner jwt.secret en application-local.properties
#                         (ese archivo esta en .gitignore) y arrancar con
#                         el perfil local activo. Ver README.md.
#   2) variable JWT_SECRET -> si existe en el entorno, gana sobre este valor.
#
# Formato: Base64 de 48 bytes (384 bits), por encima del minimo de 256 bits
# que exige HS256. Tiene que ser Base64 valido: JwtService lo decodifica con
# Base64.getDecoder(), asi que un texto libre como "cambiame" reventaria al
# arrancar.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:sGsKi90tO2gVoK3Qyej5wvbg6Ld1Dnk1xK5AJ/J7VvPa4Jfrh0xWAcu1NG6gPGlL}
jwt.expiration-ms=86400000
